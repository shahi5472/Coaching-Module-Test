    sdk: flutter

  cupertino_icons: 1.0.9

  # Firebase service package
  firebase_core: 4.4.0
  firebase_messaging: 16.1.1

  permission_handler: 12.0.1
  #  flutter_local_notifications: 22.0.0-dev.2

